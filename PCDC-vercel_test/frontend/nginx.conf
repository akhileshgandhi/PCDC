server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Case PDFs/DOCX and CSV imports are uploaded through the API.
    client_max_body_size 25m;

    # API routes go to the backend container (same paths as vercel.json).
    location ~ ^/(api|capability|ai|notification)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI case generation and evaluation can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
